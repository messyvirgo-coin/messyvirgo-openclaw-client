services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw-secure:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Upstream image sets OPENCLAW_BUNDLED_PLUGINS_DIR=/app/extensions (source). That forces
      # jiti to compile bundled extension TypeScript on every gateway boot and can blow the stack.
      # Prefer compiled outputs under dist/ (see upstream CHANGELOG: gateway loads dist/extensions).
      OPENCLAW_BUNDLED_PLUGINS_DIR: /app/dist/extensions
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-${HOME}/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACES_DIR:-${HOME}/OpenClawWorkspaces}:/home/node/workspaces
      - ${OPENCLAW_WORKSPACE_DIR:-${HOME}/OpenClawWorkspaces/main}:/home/node/.openclaw/workspace
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "${OPENCLAW_GATEWAY_PORT:-18789}"
      ]

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw-secure:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      # npm needs a writable cache path when running in read-only containers.
      NPM_CONFIG_CACHE: ${OPENCLAW_NPM_CACHE_DIR:-/tmp/.npm}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BROWSER: echo
      OPENCLAW_BUNDLED_PLUGINS_DIR: /app/dist/extensions
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-${HOME}/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACES_DIR:-${HOME}/OpenClawWorkspaces}:/home/node/workspaces
      - ${OPENCLAW_WORKSPACE_DIR:-${HOME}/OpenClawWorkspaces/main}:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    # Use the main CLI wrapper so flags match docs (e.g. `openclaw agent --message ...`)
    entrypoint: ["node", "openclaw.mjs"]
