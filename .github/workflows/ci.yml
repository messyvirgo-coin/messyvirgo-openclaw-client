name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: ShellCheck scripts
        run: |
          shellcheck secure-client/scripts/*.sh openclaw-raw/scripts/*.sh

  bash_syntax:
    name: Bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: bash -n scripts
        run: |
          for f in secure-client/scripts/*.sh openclaw-raw/scripts/*.sh; do
            bash -n "$f"
          done

