services:
  openclaw-gateway:
    # Linux-only workaround: avoid Docker port publishing (-p) entirely.
    # Scripts set OPENCLAW_GATEWAY_BIND=loopback for this stack (see compose_linux_hostnet in _common.sh).
    # Keep explicit empty ports override as a guard when merging compose files.
    network_mode: host
    ports: []
  openclaw-cli:
    network_mode: host
